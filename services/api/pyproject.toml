[project]
name = "kazenotayori-api"
version = "0.1.0"
description = "风信 Kaze no tayori — 匿名漂流信后端"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "sqlalchemy==2.0.52",
    "geoalchemy2==0.20.0",
    "alembic==1.19.1",
    "asyncpg==0.31.0",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pyjwt==2.13.0",
    "python-multipart==0.0.32",
    "pillow==12.3.0",
    "shapely==2.1.2",
    "httpx==0.28.1",
    "openai==3.3.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.3",
    "mypy==2.3.1",
    "types-shapely==2.1.0.20260728",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------- ruff ----------------
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]
ignore = [
    # FastAPI 依赖注入的标准写法就是在默认值里调用 Depends()/Query()
    "B008",
    # 文档字符串与注释里大量中文全角标点，属于本项目的刻意选择
    "RUF001",
    "RUF002",
    "RUF003",
    # 异常类刻意不带 Error 后缀：NotFound / Unauthorized / Forbidden 对齐
    # HTTP 状态语义，在 API 上下文里比 NotFoundError 更好读
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501", "I001"]
"tests/*" = ["E501"]
# 种子信是整段散文，硬折行伤可读性
"scripts/*" = ["E501"]

# ---------------- mypy ----------------
[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "shapely.*", "alembic.*", "asyncpg.*"]
ignore_missing_imports = true

# ---------------- pytest ----------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "db: 需要真实 PostGIS 连接的测试（make check-db 才跑，make check 跳过）",
]
