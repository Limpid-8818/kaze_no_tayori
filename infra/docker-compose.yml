# 本地默认只启动 db；完整服务栈用于云服务器部署（PRD §8.3 / §11 DoD）。
# 本地调试流程见 docs/DEV_SETUP.md。

services:
  db:
    image: postgis/postgis:17-3.5
    # 官方 PostGIS 17 镜像当前只有 amd64；Docker Desktop 在 Apple Silicon 上透明模拟。
    platform: ${DB_PLATFORM:-linux/amd64}
    restart: unless-stopped
    environment:
      POSTGRES_DB: kazenotayori
      POSTGRES_USER: ${POSTGRES_USER:-kaze}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次启动自动装 PostGIS extension
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kaze} -d kazenotayori"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    env_file: ../.env
    environment:
      # 容器内连同一 compose 网络里的 db，覆盖 .env 里的本地/远程地址
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kaze}:${POSTGRES_PASSWORD}@db:5432/kazenotayori
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-kaze}:${POSTGRES_PASSWORD}@db:5432/kazenotayori
      DB_SCHEMA: public
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # STORAGE_BACKEND=local 时的图片落盘目录
      - uploads:/app/uploads

  # 对象存储（可选）。STORAGE_BACKEND=local 时不需要起它。
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-kaze}
      # profile 未启用时 compose 也会插值；留空不应阻塞 db-only 启动。
      # 真正启用 s3 profile 时 MinIO 会拒绝空或过短密码。
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  pgdata:
  uploads:
  miniodata:
